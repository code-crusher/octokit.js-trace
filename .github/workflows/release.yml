name: Release
"on":
  push:
    branches:
      - main
      - next
      - beta
      - "*.x"
      - debug
# These are recommended by the semantic-release docs: https://github.com/semantic-release/npm#npm-provenance
# `id-token: write` enables OIDC-based authentication for npm provenance and
# trusted publishing: https://docs.npmjs.com/trusted-publishers
# No NPM_TOKEN secret is needed — the package is published using trusted publishing,
# which requires a one-time configuration on npmjs.com linking this repository,
# this workflow, and the `release` environment to the `octokit` package.
permissions:
    contents: write # to be able to publish a GitHub release
    issues: write # to be able to comment on released issues
    pull-requests: write # to be able to comment on released pull requests
    id-token: write # to enable use of OIDC for npm provenance

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
